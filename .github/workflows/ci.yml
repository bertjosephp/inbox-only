# Build, style, lint and unit tests on every push and pull request.
# GitHub's Ubuntu runners ship the Android SDK (ANDROID_HOME is preset); AGP downloads any
# missing platform on first use.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Style (Spotless + ktlint)
        run: ./gradlew spotlessCheck

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Android Lint
        run: ./gradlew lintDebug

      - name: Build debug and release APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Fail if any APK requests INTERNET
        run: scripts/check-no-internet.sh

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/
